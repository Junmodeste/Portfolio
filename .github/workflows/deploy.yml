name: pages-redirect

# Le site est hébergé sur Vercel (modestekoffi.com). GitHub Pages ne sert plus
# qu'une page de redirection pour l'ancienne adresse junmodeste.github.io/Portfolio/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v5
